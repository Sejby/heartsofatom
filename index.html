<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearts of Atom</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="map"></canvas>

  <div id="topbar" class="ingame">
    <div class="tb-country"></div>
    <div class="tb-stats"></div>
    <div class="tb-time">
      <div class="tension" title="Světové napětí"><i id="tension"></i></div>
      <div class="tb-date"></div>
      <div class="speeds">
        <button id="pauseBtn" data-act="pause" title="Pauza (mezerník)">❚❚</button>
        <button class="spd" data-act="speed" data-arg="1">1</button>
        <button class="spd" data-act="speed" data-arg="2">2</button>
        <button class="spd" data-act="speed" data-arg="3">3</button>
        <button class="spd" data-act="speed" data-arg="4">4</button>
        <button class="spd" data-act="speed" data-arg="5">5</button>
      </div>
    </div>
    <button class="menubtn" data-act="menu" title="Menu">☰</button>
    <div id="menu" class="hidden">
      <button data-act="save">💾 Uložit hru</button>
      <button data-act="load">📂 Načíst hru</button>
      <button data-act="help">❓ Jak hrát</button>
      <button data-act="newGame">↺ Nová hra</button>
    </div>
  </div>

  <div id="leftbar" class="ingame">
    <button data-act="panel" data-arg="politics" title="Politika a národní cíle">🏛<span>Politika</span></button>
    <button data-act="panel" data-arg="research" title="Výzkum">🔬<span>Výzkum</span></button>
    <button data-act="panel" data-arg="production" title="Výroba a stavby">🏭<span>Výroba</span></button>
    <button data-act="panel" data-arg="army" title="Armáda">🎖<span>Armáda</span></button>
    <button data-act="panel" data-arg="diplomacy" title="Diplomacie">🤝<span>Diplomacie</span></button>
    <button data-act="panel" data-arg="market" title="Trh zbraní">🛒<span>Trh</span></button>
    <button data-act="panel" data-arg="wars" title="Války">⚔<span>Války</span></button>
    <button data-act="panel" data-arg="news" title="Zprávy">📰<span>Zprávy</span></button>
  </div>

  <div id="panel" class="hidden"></div>
  <div id="side" class="hidden"></div>
  <div id="ticker" class="ingame"></div>

  <div id="mapmodes">
    <button class="on" data-act="mode" data-arg="political">Politická</button>
    <button data-act="mode" data-arg="faction">Aliance</button>
    <button data-act="mode" data-arg="ideology">Ideologie</button>
    <button data-act="mode" data-arg="relations" class="ingame">Vztahy</button>
    <button data-act="mode" data-arg="war" class="ingame">Válka</button>
  </div>

  <div id="focus" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toasts"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="errlog" class="hidden"></div>
  <div id="start"></div>
  <div id="loading"><div class="logo">HEARTS OF <span>ATOM</span></div><div>Generuji svět a provincie…</div></div>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="data/regions.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/events.js"></script>
  <script src="js/world.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/flags.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
